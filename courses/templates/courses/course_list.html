{% extends 'base.html' %}
{% block content %}
<h2>Liste des cours</h2>
<a href="{% url 'course_create' %}">+ Créer un cours</a>
<hr>
<ul>
  {% for course in courses %}
    <li>
      <a href="{% url 'course_detail' course.pk %}">{{ course.title }} - {{ course.teacher }}</a>
    </li>
  {% empty %}
    <li>Aucun cours pour le moment.</li>
  {% endfor %}
</ul>
{% endblock %}
