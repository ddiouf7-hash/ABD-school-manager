<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{{ student.first_name }} {{ student.last_name }}</title>
</head>
<body>
  <a href="/students/">« Retour à la liste</a>
  <h1>{{ student.first_name }} {{ student.last_name }}</h1>
  <p><b>Email :</b> {{ student.email }}</p>
  <p><b>Age :</b> {{ student.age }}</p>
  <p><b>Classe :</b> {{ student.classe }}</p>
  <p><b>Créé le :</b> {{ student.created_at }}</p>

  <p>
    <a href="/students/{{ student.pk }}/edit/">Modifier</a> |
    <a href="/students/{{ student.pk }}/delete/">Supprimer</a>
  </p>
</body>
</html>
