<!DOCTYPE html>
<html lang="fr">
<head>  
   <meta charset="UTF-8">  
   <title>Étudiants · School Manager</title>
</head> 
<body>    
     <a href="/">← Accueil</a>  
     <h1>Liste des étudiants</h1>   
         <table border="1">      
             <tr><th>N°</th><th>Prénom</th><th>Nom</th><th>Classe</th></tr>   
             {% for student in students %}            
             <tr>                
                 <td>{{ student.id }}</td>                
                 <td>{{ student.first_name }}</td>                
                 <td>{{ student.last_name }}</td>                
                 <td>{{ student.classe }}</td>           
                 </tr>        
             {% empty %}             
                 <tr><td colspan="4">Aucun étudiant inscrit.</td></tr>        
                 {% endfor %}     
                </table> 
            </body> 
            </html>
